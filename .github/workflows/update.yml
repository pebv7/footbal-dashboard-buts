name: Mise à jour des résultats

on:
  schedule:
    - cron: '20 1 * * *'      # une fois par jour, à 01:20 UTC
  workflow_dispatch:           # bouton manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les résultats ESPN
        run: python fetch_espn.py

      - name: Construire le dashboard
        run: python build.py

      - name: Publier si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html historique.json
          git diff --staged --quiet && echo "aucun changement" && exit 0
          git commit -m "résultats au $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
